<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CocoKiki – Moestuin (level 2)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--keuken:#FF6B3D;--tuin:#3FBF5A;--tuin-r:#2A8F40;--school:#22B59A;--wereld:#3AA8F5;--zon:#FFC93A;--zon-r:#D79A14;--bes:#FF5FA2;--druif:#9B6BFF;--cacao:#4A2A1A;--room:#FFF8EC;--veer:cubic-bezier(.34,1.56,.64,1);--actief:var(--school)}
[data-wereld=keuken]{--actief:var(--keuken)}[data-wereld=tuin]{--actief:var(--tuin)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2a1a10;font-family:Nunito,system-ui,sans-serif;color:var(--cacao);overflow:hidden;user-select:none}
.stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;margin:auto;top:50%;transform:translateY(-50%);overflow:hidden;background:#C98A52;container-type:inline-size}
.wereld{position:absolute;inset:-2%;transition:transform .4s ease-out}
.wereld img{position:absolute;top:0;height:100%;width:auto;left:50%;transform:translateX(-50%)}
.licht{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 30% 20%,rgba(255,236,190,.3),transparent 70%)}
.ck-glas{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.46),rgba(255,255,255,.16));-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),inset 0 -8px 20px rgba(255,255,255,.12),0 12px 32px rgba(40,20,5,.25)}
.ck-glas::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 60% at var(--gx,30%) -10%,rgba(255,255,255,.75),transparent 55%);mix-blend-mode:soft-light}
/* ZONE 1 linksboven: terug */
.ck-zone-terug{position:absolute;left:1.6cqw;top:1.6cqw;width:4.4cqw;height:4.4cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:20;cursor:pointer}
.ck-zone-terug svg,.ck-zone-menu svg,.ck-zone-gereedschap svg{width:46%;height:46%}
/* ZONE 2 boven midden: statuseiland */
.ck-zone-status{position:absolute;top:1.6cqw;left:50%;transform:translateX(-50%);height:4.4cqw;border-radius:999px;display:flex;align-items:center;gap:.9cqw;padding:0 1.4cqw 0 .7cqw;z-index:20;white-space:nowrap;transition:height .55s var(--veer),padding .55s var(--veer)}
.munt{width:2.8cqw;height:2.8cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF0A8,var(--zon) 55%,var(--zon-r));box-shadow:inset 0 -2px 0 rgba(0,0,0,.15),0 2px 6px rgba(215,154,20,.5);flex-shrink:0}
.ck-zone-status b{font-family:'Baloo 2';font-weight:800;font-size:2cqw;line-height:1}
.scheid{width:1px;height:50%;background:rgba(74,42,26,.2)}
.stip{width:1.3cqw;height:1.3cqw;border-radius:50%;background:rgba(255,255,255,.6);border:2px solid rgba(74,42,26,.18);transition:all .4s var(--veer)}
.stip.vol{background:var(--actief);border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.stip.nu{transform:scale(1.35);border:2px solid var(--actief)}
.niveau{font-weight:900;font-size:1.05cqw;padding:.25cqw .8cqw;border-radius:999px;background:var(--actief);color:#fff}
.extra{display:flex;align-items:center;gap:.6cqw;max-width:0;opacity:0;overflow:hidden;transition:max-width .6s var(--veer),opacity .3s;font-weight:900;font-size:1.25cqw}
.ck-zone-status.is-open{height:5.8cqw}.ck-zone-status.is-open .extra{max-width:30cqw;opacity:1}
.kaartje{width:2.6cqw;height:3.2cqw;border-radius:.6cqw;background:linear-gradient(160deg,#B996FF,var(--druif));box-shadow:0 3px 0 #6E44D1;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Baloo 2';font-size:1.4cqw}
/* ZONE 3 rechtsboven: menu */
.ck-zone-menu{position:absolute;right:1.6cqw;top:1.6cqw;height:4.4cqw;border-radius:999px;display:flex;align-items:center;gap:.4cqw;padding:0 .4cqw;z-index:20}
.ck-zone-menu .k{width:3.6cqw;height:3.6cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ck-zone-menu .k:hover{background:rgba(255,255,255,.4)}
.ck-zone-menu img{width:3.6cqw;height:3.6cqw;border-radius:50%;object-fit:cover;object-position:top;border:2px solid #fff}
/* ZONE 4 rechts: gereedschapsbalk */
.ck-zone-gereedschap{position:absolute;right:1.6cqw;top:8.6cqw;display:flex;flex-direction:column;gap:.5cqw;padding:.5cqw;border-radius:2.6cqw;z-index:20}
.ck-zone-gereedschap .k{width:4cqw;height:4cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s var(--veer);position:relative}
.ck-zone-gereedschap .k:hover{transform:scale(1.1);background:rgba(255,255,255,.4)}
.ck-zone-gereedschap .k.is-aan{background:var(--actief);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.ck-zone-gereedschap .k .tip{position:absolute;right:120%;background:var(--cacao);color:#fff;font-weight:800;font-size:1cqw;padding:.3cqw .7cqw;border-radius:.6cqw;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.ck-zone-gereedschap .k:hover .tip{opacity:1}
.ck-zone-gereedschap .lijn{height:1px;margin:.2cqw .6cqw;background:rgba(74,42,26,.18)}
/* ZONE 5 linksonder: personage */
.ck-zone-personage{position:absolute;left:1.6cqw;bottom:1.6cqw;display:flex;align-items:flex-end;gap:1cqw;z-index:10}
.ck-zone-personage img{width:9.5cqw;height:9.5cqw;border-radius:50%;object-fit:cover;object-position:top;border:.35cqw solid #fff;background:#fff;box-shadow:0 .5cqw 0 rgba(138,78,37,.35),0 1cqw 2cqw rgba(0,0,0,.25);transition:transform .4s var(--veer)}
.ck-zone-personage.is-blij img{transform:translateY(-1.2cqw) rotate(-8deg) scale(1.08)}
.ballon{background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(255,255,255,.78))!important;border-radius:1.8cqw 1.8cqw 1.8cqw .5cqw;padding:.9cqw 1.5cqw;max-width:30cqw;margin-bottom:3cqw}
.ballon small{display:block;font-weight:900;font-size:1cqw;color:var(--bes);letter-spacing:.03em}
.ballon div{font-family:'Baloo 2';font-weight:700;font-size:1.9cqw;line-height:1.15}
.ballon.nieuw{animation:pop .5s var(--veer)}
/* ZONE 6 rechtsonder: antwoorden of hoofdknop */
.ck-zone-antwoord{position:absolute;right:7.6cqw;bottom:1.6cqw;display:flex;gap:1.4cqw;z-index:12;align-items:flex-end}
.ck-zone-antwoord .uitleg{position:absolute;right:0;top:-2.6cqw;font-weight:900;font-size:1.05cqw;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap}
.ck-bel{width:8.4cqw;height:8.4cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;font-size:3.3cqw;color:#fff;cursor:grab;touch-action:none;text-shadow:0 .2cqw 0 rgba(0,0,0,.18);transition:transform .35s var(--veer),opacity .3s;animation:zweef 3s ease-in-out infinite}
.ck-bel:nth-child(3){animation-delay:-.7s}.ck-bel:nth-child(4){animation-delay:-1.4s}.ck-bel:nth-child(5){animation-delay:-2.1s}
.ck-bel .kern{position:absolute;inset:14%;border-radius:50%;z-index:-1;opacity:.95}
.ck-bel:hover{transform:scale(1.08)}
.ck-bel.is-slepen{cursor:grabbing;animation:none;transition:none;z-index:30}
.ck-bel.is-fout{animation:wiebel .4s ease}
.ck-bel.is-weg{opacity:.25;pointer-events:none}
.ck-bel small{font-size:1.3cqw;margin-left:.2cqw;align-self:flex-end;margin-bottom:2.4cqw}
/* speelveld */
.ck-hangkaartje{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;animation:schommel 3.4s ease-in-out infinite;transform-origin:50% 0;z-index:5}
.ck-hangkaartje .touw{width:2px;height:3.2cqw;background:linear-gradient(#fff8,#fff)}
.ck-hangkaartje .label{padding:.45cqw 1.1cqw;border-radius:1.2cqw;font-family:'Baloo 2';font-weight:800;font-size:2.3cqw;line-height:1.1;text-align:center}
.ck-hangkaartje .label small{display:block;font-family:Nunito;font-weight:900;font-size:.95cqw;opacity:.75;margin-top:-.2cqw}
.glow{position:absolute;border-radius:50%;background:radial-gradient(rgba(255,230,150,.9),transparent 70%);transform:translate(-50%,-50%);animation:puls 1.8s ease-in-out infinite;z-index:4;pointer-events:none}
.ck-doel{position:absolute;border-radius:1.4cqw;border:.35cqw dashed rgba(255,255,255,.9);box-shadow:0 0 0 .4cqw rgba(63,191,90,.35),0 0 3cqw rgba(255,240,170,.6);animation:puls 1.8s ease-in-out infinite;z-index:4}
.mand{position:absolute;z-index:9;border-radius:3cqw;transition:background .2s}
.mand.is-over{background:radial-gradient(closest-side,rgba(255,236,160,.5),transparent)}
.vonk{position:absolute;width:1.1cqw;height:1.1cqw;border-radius:50%;pointer-events:none;z-index:40}
.vlieg{position:absolute;z-index:45;pointer-events:none;transition:all .75s cubic-bezier(.5,-0.4,.3,1)}
.plant{position:absolute;transform:translate(-50%,-100%);font-size:0;z-index:6;animation:groei .8s var(--veer) both}
@keyframes schommel{0%,100%{rotate:-3deg}50%{rotate:3deg}}
@keyframes puls{50%{opacity:.4;scale:1.04}}
@keyframes zweef{50%{translate:0 -.8cqw}}
@keyframes wiebel{25%{translate:-1cqw 0;rotate:-8deg}75%{translate:1cqw 0;rotate:8deg}}
@keyframes pop{0%{scale:.6;opacity:0}60%{scale:1.1}100%{scale:1;opacity:1}}
@keyframes groei{0%{scale:0}100%{scale:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

</div>
<script>
const $=id=>document.getElementById(id);const stage=$('stage');
let ctx;function toon(f,d=.12,t='sine',v=.15){try{ctx=ctx||new AudioContext();const o=ctx.createOscillator(),g=ctx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
function ding(){[660,880,1320].forEach((f,i)=>setTimeout(()=>toon(f,.18,'triangle'),i*80))}
function boing(){toon(220,.2,'sine',.12);setTimeout(()=>toon(180,.2,'sine',.1),90)}
function zeg(t){const b=$('ballon');$('zin').textContent=t;b.classList.remove('nieuw');b.offsetHeight;b.classList.add('nieuw')}
const kleuren=['#3AA8F5','#FF5FA2','#3FBF5A','#9B6BFF'];
function maakOrbs(opties,eenheid,kies){const box=$('orbs');box.querySelectorAll('.ck-bel').forEach(o=>o.remove());
  opties.forEach((n,i)=>{const o=document.createElement('div');o.className='ck-bel ck-glas';o.innerHTML=`<span class="kern" style="background:radial-gradient(circle at 35% 30%,#fff6,${kleuren[i]} 60%)"></span>${n}${eenheid?'<small>'+eenheid+'</small>':''}`;o.dataset.n=n;koppel(o,kies);box.appendChild(o)})}
let bezig=false;
function koppel(o,kies){let sx,sy,bew=false;
  o.addEventListener('pointerdown',e=>{if(bezig)return;o.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;bew=false;o.classList.add('is-slepen');toon(520,.06)});
  o.addEventListener('pointermove',e=>{if(!o.classList.contains('is-slepen'))return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>6)bew=true;o.style.transform=`translate(${dx}px,${dy}px) scale(1.12) rotate(${dx/30}deg)`;$('mand').classList.toggle('is-over',opBoven(e))});
  o.addEventListener('pointerup',e=>{o.classList.remove('is-slepen');$('mand').classList.remove('is-over');const raak=!bew||opBoven(e);o.style.transform='';if(raak)kies(o)})}
function opBoven(e){const r=$('mand').getBoundingClientRect();return e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom}
function vonken(o){const r=o.getBoundingClientRect(),s=stage.getBoundingClientRect();for(let i=0;i<22;i++){const v=document.createElement('div');v.className='vonk';v.style.background=['#FFC93A','#FF5FA2','#3FBF5A','#3AA8F5','#fff'][i%5];v.style.left=(r.left-s.left+r.width/2)+'px';v.style.top=(r.top-s.top+r.height/2)+'px';stage.appendChild(v);const h=Math.random()*Math.PI*2,d=60+Math.random()*120;v.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(h)*d}px,${Math.sin(h)*d-40}px) scale(.2)`,opacity:0}],{duration:700+Math.random()*400,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>v.remove()}}
let munten=65;
function beloon(o,titel){const r=o.getBoundingClientRect(),s=stage.getBoundingClientRect(),t=document.querySelector('#status .munt').getBoundingClientRect();
  for(let i=0;i<5;i++){const m=document.createElement('div');m.className='vlieg';m.style.cssText+=`width:${t.width}px;height:${t.width}px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF0A8,#FFC93A 55%,#D79A14);left:${r.left-s.left+r.width/2}px;top:${r.top-s.top+r.height/2}px`;stage.appendChild(m);
    setTimeout(()=>{m.style.left=(t.left-s.left)+'px';m.style.top=(t.top-s.top)+'px';m.style.transform='scale(.8)'},30+i*90);
    setTimeout(()=>{m.remove();munten++;$('munten').textContent=munten;toon(990+i*60,.07,'triangle',.08)},800+i*90)}
  $('extra').innerHTML='<span class="scheid"></span><span>+5</span><span class="kaartje">★</span><span>'+titel+'</span>';
  const st=$('status');setTimeout(()=>st.classList.add('is-open'),500);setTimeout(()=>st.classList.remove('is-open'),2300)}
function stippen(n,klaar){const b=$('stippen');b.innerHTML='';for(let i=0;i<n;i++){const s=document.createElement('span');s.className='stip'+(i<klaar?' vol':'')+(i===klaar?' nu':'');b.appendChild(s)}}
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;$('wereld').style.transform=`translate(${-x*14}px,${-y*10}px) scale(1.02)`;document.querySelectorAll('.ck-glas').forEach(l=>l.style.setProperty('--gx',(50+x*80)+'%'))});
document.querySelectorAll('.ck-zone-gereedschap .k').forEach(k=>k.addEventListener('click',()=>{toon(600,.06);k.classList.toggle('is-aan')}));

const vragen=[{z:'Bak 1 is 2 meter. Om de 50 cm een zaadje. Hoeveel passen er?',j:4,o:[2,3,4,5],e:''},
 {z:'Hoeveel centimeter is 2 meter?',j:200,o:[20,200,2000,250],e:'cm'},
 {z:'Elke plant krijgt 2 bekers water. Hoeveel bekers voor 4 planten?',j:8,o:[6,8,4,10],e:''}];
let v=0;
function ronde_(){const q=vragen[v%vragen.length];maakOrbs(q.o.slice().sort(()=>Math.random()-.5),q.e,kies);stippen(6,v%6);zeg(q.z);bezig=false}
function plant(n){const p=$('planten');p.innerHTML='';for(let i=0;i<n;i++){const s=document.createElement('div');s.className='plant';s.style.left=(17.5+i*5.4)+'%';s.style.top='26%';s.style.animationDelay=(i*.12)+'s';s.innerHTML='<svg width="44" height="44" viewBox="0 0 40 40"><path d="M20 38V20" stroke="#2A8F40" stroke-width="3" stroke-linecap="round"/><path d="M20 22c-8 0-12-6-12-12 7 0 12 4 12 12z" fill="#3FBF5A"/><path d="M20 18c0-8 5-13 13-13 0 8-5 13-13 13z" fill="#6BD87E"/></svg>';p.appendChild(s)}}
function kies(o){if(bezig)return;const n=+o.dataset.n,q=vragen[v%vragen.length];
  if(n===q.j){bezig=true;ding();vonken(o);$('persoon').classList.add('is-blij');zeg(['Precies! Ze passen er netjes in.','Goed zo, 200 centimeter!','Klopt, de plantjes zijn blij.'][v%3]);
    document.querySelectorAll('.ck-bel').forEach(x=>x!==o&&x.classList.add('is-weg'));if(v%3===0)plant(4);setTimeout(()=>beloon(o,['Tuinmeter','Maat-meester','Waterheld'][v%3]),350);
    setTimeout(()=>{$('persoon').classList.remove('is-blij');document.querySelectorAll('.ck-zone-gereedschap .k').forEach(k=>k.classList.remove('is-aan'));v++;ronde_()},2800)}
  else{boing();o.classList.remove('is-fout');o.offsetHeight;o.classList.add('is-fout');zeg(['Pak de liniaal erbij: 50 cm, 1 m, 1,5 m, 2 m. Tel de stappen.','1 meter is 100 centimeter. En 2 meter?','Tel 2 bekers per plant: 2, 4, ...'][v%3]);document.querySelector('.ck-zone-gereedschap .k:nth-child(2)').classList.add('is-aan')}}
ronde_();</script></body></html>
